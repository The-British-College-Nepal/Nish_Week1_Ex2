name: "SSD Interactive Lab: Vehicle Hierarchy"

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure write permissions to update README.md and current_step.txt
permissions:
  contents: write

jobs:
  grade_and_advance:
    name: "Evaluate Code & Advance Step"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Student Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Evaluator & Step Tracker
        run: |
          chmod +x .github/scripts/check_progress.sh
          ./.github/scripts/check_progress.sh
